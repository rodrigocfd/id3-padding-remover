[package]
name = "id3-fit"
description = "Removes padding from ID3v2 tags, and does other stuff."
version = "4.0.0"
authors = ["Rodrigo Cesar de Freitas Dias <rcesar@gmail.com>"]
edition = "2021"

[profile.release]
lto = true
strip = true
codegen-units = 1
# panic = "abort"

[dependencies]
try-iterator = { version = "1.*" }
winsafe = { path = "../winsafe", features = ["gui", "raw-dylib", "shell", "version"] }

# https://doc.rust-lang.org/reference/linkage.html#static-and-dynamic-c-runtimes
# RUSTFLAGS='-C target-feature=+crt-static' cargo build --release --target x86_64-pc-windows-msvc
